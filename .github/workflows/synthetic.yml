name: Synthetic monitoring

# Uptime and correctness checks against production, on a schedule.
#
# This is the $0 substitute for a hosted synthetic monitoring product. It is
# genuinely free: Actions minutes are unlimited on public repositories. The
# honest limitation is resolution and alerting: a 30-minute cron cannot detect a
# 4-minute outage, and a failed workflow emails you rather than paging you.
# For a portfolio that is the right trade. See docs/INCIDENT_RESPONSE.md.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  probe:
    name: Probe production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Smoke test production
        run: bash scripts/smoke.sh "${{ vars.NEXT_PUBLIC_SITE_URL }}"

      - name: Open an issue if production is failing
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Production smoke test failing";
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "incident",
            });
            // One open incident at a time. Reopening every 30 minutes is how
            // alert fatigue starts.
            if (open.some(i => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title, labels: ["incident"],
              body: `Synthetic probe failed at ${new Date().toISOString()}.\n\n`
                  + `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}`
                  + `/actions/runs/${context.runId}\n\n`
                  + `Follow docs/INCIDENT_RESPONSE.md. Close this issue when the probe passes again.`,
            });

  links:
    name: External links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Weekly rather than half-hourly: these are other people's hosts, and a
    # transient 502 on someone else's demo is not an incident on yours.
    if: github.event.schedule == null || github.run_attempt == 1
    steps:
      - uses: actions/checkout@v7
      - name: Check all project and profile links
        run: npm run links
        continue-on-error: true
