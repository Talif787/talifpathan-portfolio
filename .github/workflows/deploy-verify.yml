name: Verify deployment

# Vercel's GitHub integration reports a deployment_status when a build finishes.
# Hooking that event verifies every deployment, preview and production alike,
# without this repository holding a Vercel token. Fewer secrets, smaller blast
# radius, and previews get the same gate production does.
on: deployment_status

concurrency:
  group: verify-${{ github.event.deployment_status.environment_url }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke test
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Smoke test the deployment
        run: bash scripts/smoke.sh "${{ github.event.deployment_status.environment_url }}"

  lighthouse:
    name: Lighthouse budgets
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Audit
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: ${{ github.event.deployment_status.environment_url }}
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
